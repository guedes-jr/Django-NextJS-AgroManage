<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#176b3a" />
    <title>Fazenda Mais — sem conexão</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; color: #17351f; background: #f4f8f3; }
      main { max-width: 440px; padding: 32px; text-align: center; background: #fff; border: 1px solid #dce8de; border-radius: 18px; box-shadow: 0 12px 36px rgba(17, 63, 34, .12); }
      img { width: 88px; height: 88px; border-radius: 20px; }
      h1 { margin: 20px 0 10px; font-size: 24px; }
      p { margin: 0 0 22px; color: #5a6b5e; line-height: 1.5; }
      button { padding: 11px 18px; color: #fff; font: inherit; font-weight: 700; background: #176b3a; border: 0; border-radius: 9px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-192x192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>Reconecte-se à internet para continuar usando o Fazenda Mais.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
