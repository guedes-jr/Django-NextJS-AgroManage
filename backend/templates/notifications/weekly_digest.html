<!doctype html><html lang="pt-BR"><body style="margin:0;background:#f3f7f0;font-family:Arial,sans-serif;color:#173023"><div style="max-width:640px;margin:0 auto;padding:28px"><div style="background:#176b3a;color:white;padding:24px;border-radius:14px 14px 0 0"><h1 style="margin:0;font-size:22px">Resumo semanal</h1><p style="margin:7px 0 0;color:#dcecdf">{{ count }} notificação{{ count|pluralize:"ões" }} da última semana</p></div><div style="background:white;padding:12px 24px 24px;border-radius:0 0 14px 14px">{% for notification in notifications %}<div style="padding:16px 0;border-bottom:1px solid #e2e8df"><strong>{{ notification.title }}</strong><p style="margin:6px 0;color:#657169;line-height:1.5">{{ notification.message }}</p>{% if notification.link %}<a href="{{ notification.link }}" style="color:#176b3a;font-weight:bold">Abrir no Fazenda Mais</a>{% endif %}</div>{% endfor %}</div></div></body></html>
